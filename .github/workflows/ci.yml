name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : la CI lit le code, rien de plus.
permissions:
  contents: read

# Un nouveau push annule la vérification en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Le déploiement sur GitHub Pages sera ajouté ici, dans un job `deploy`
  # qui dépendra de `check` (needs: check), au moment de la mise en ligne.
